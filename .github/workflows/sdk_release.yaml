name: Release SDKs

# Publishes the SDKs to crates.io, npm and PyPI.
#
# The SDK version is taken from the MCP server release tag (the semver tags
# created by `.github/workflows/generate_versions.yaml`), so pushing one of
# those tags releases the server *and* every SDK at the same version:
#
#   git tag 0.7.0 && git push origin 0.7.0   # (normally done by cog bump)
#
# The three publish jobs are independent and run in parallel; each one resolves
# the version itself via `.github/actions/resolve-sdk-version`.
#
# The Go SDK is generated but intentionally not published.

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the latest tag)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust:
    name: Publish Rust crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Check if version is already published
        id: check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: jilebi-release' \
            "https://crates.io/api/v1/crates/jilebi-sdk/$VERSION")"
          if [ "$status" = "200" ]; then
            echo "jilebi-sdk $VERSION is already on crates.io; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        if: steps.check.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set SDK version
        if: steps.check.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Package crate
        if: steps.check.outputs.published != 'true'
        run: cargo package -p jilebi-sdk --allow-dirty

      - name: Publish to crates.io
        if: steps.check.outputs.published != 'true'
        run: cargo publish -p jilebi-sdk --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  typescript:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token used by npm trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1, which is required for OIDC
          # trusted publishing.
          node-version: 24
          # No registry-url: setup-node would set a dummy NODE_AUTH_TOKEN,
          # masking an OIDC failure as a misleading 404 on publish.
          package-manager-cache: false # never use caching in release builds

      - name: Check if version is already published
        id: check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@jilebi/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@jilebi/sdk@$VERSION is already on npm; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm supports trusted publishing
        if: steps.check.outputs.published != 'true'
        shell: bash
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is too old; trusted publishing requires >= 11.5.1"
            exit 1
          fi

      - name: Check npm trusted publishing
        if: steps.check.outputs.published != 'true'
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub did not provide an OIDC token. The job must set 'permissions: id-token: write'."
            exit 1
          fi

          response="$(curl -sS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")"
          id_token="$(printf '%s' "$response" | jq -r '.value // empty')"
          if [ -z "$id_token" ]; then
            echo "::error::GitHub did not return an OIDC token: $response"
            exit 1
          fi

          echo "GitHub OIDC identity presented to npm:"
          printf '%s' "$id_token" | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keys = ("repository", "repository_owner", "workflow", "workflow_ref",
                  "job_workflow_ref", "ref", "environment")
          print(json.dumps({k: claims.get(k) for k in keys}, indent=2))
          '

          body="$(mktemp)"
          status="$(curl -sS -o "$body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@jilebi%2fsdk")"
          if [ "$status" != "200" ]; then
            echo "::error::npm rejected the OIDC token exchange (HTTP $status): $(cat "$body"). The trusted publisher for @jilebi/sdk on npmjs.com must match these claims exactly: repository Datron/jilebi, workflow sdk_release.yaml, no environment, and 'Allow npm publish' enabled."
            exit 1
          fi
          echo "npm accepted the OIDC token exchange"

      - name: Set SDK version
        if: steps.check.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Install dependencies
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/typescript
        run: npm install

      - name: Build
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/typescript
        run: npm run build

      # No NODE_AUTH_TOKEN: npm detects the GitHub OIDC environment and
      # exchanges it for a short-lived publish credential. Provenance is
      # generated automatically. The trusted publisher must be configured on
      # npmjs.com for @jilebi/sdk (see sdks/README.md).
      - name: Publish to npm (trusted publishing)
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/typescript
        run: npm publish --access public

  python:
    name: Publish Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token used by PyPI trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Check if version is already published
        id: check
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/jilebi-sdk/$VERSION/json")"
          if [ "$status" = "200" ]; then
            echo "jilebi-sdk $VERSION is already on PyPI; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Python
        if: steps.check.outputs.published != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set SDK version
        if: steps.check.outputs.published != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Build distribution
        if: steps.check.outputs.published != 'true'
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build

      # No password: PyPA's action exchanges the GitHub OIDC token for a
      # short-lived PyPI upload token. The trusted publisher must be configured
      # on PyPI for the jilebi-sdk project (see sdks/README.md).
      - name: Publish to PyPI (trusted publishing)
        if: steps.check.outputs.published != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
