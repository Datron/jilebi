name: Release SDKs

# Publishes the SDKs to crates.io, npm and PyPI.
#
# The SDK version is taken from the MCP server release tag (the semver tags
# created by `.github/workflows/generate_versions.yaml`), so pushing one of
# those tags releases the server *and* every SDK at the same version:
#
#   git tag 0.7.0 && git push origin 0.7.0   # (normally done by cog bump)
#
# The three publish jobs are independent and run in parallel; each one resolves
# the version itself via `.github/actions/resolve-sdk-version`.
#
# The Go SDK is generated but intentionally not published.

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to the latest tag)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rust:
    name: Publish Rust crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set SDK version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Package crate
        run: cargo package -p jilebi-sdk --allow-dirty

      - name: Publish to crates.io
        run: cargo publish -p jilebi-sdk --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  typescript:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token used by npm trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm >= 11.5.1, which is required for OIDC
          # trusted publishing.
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds

      - name: Verify npm supports trusted publishing
        shell: bash
        run: |
          version="$(npm --version)"
          echo "npm $version"
          if [ "$(printf '%s\n11.5.1\n' "$version" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm $version is too old; trusted publishing requires >= 11.5.1"
            exit 1
          fi

      - name: Set SDK version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm install

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

      # No NODE_AUTH_TOKEN: npm detects the GitHub OIDC environment and
      # exchanges it for a short-lived publish credential. Provenance is
      # generated automatically. The trusted publisher must be configured on
      # npmjs.com for @jilebi/sdk (see sdks/README.md).
      - name: Publish to npm (trusted publishing)
        working-directory: sdks/typescript
        run: npm publish --access public

  python:
    name: Publish Python package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token used by PyPI trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        uses: ./.github/actions/resolve-sdk-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set SDK version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node sdks/scripts/set-version.mjs "$VERSION"

      - name: Build distribution
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build

      # No password: PyPA's action exchanges the GitHub OIDC token for a
      # short-lived PyPI upload token. The trusted publisher must be configured
      # on PyPI for the jilebi-sdk project (see sdks/README.md).
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
