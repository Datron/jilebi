name: Release SDKs

# Publishes the generated SDKs to crates.io, npm and PyPI.
#
# Trigger it by pushing a tag such as `sdk-v1.0.0`, or run it manually with a
# version. The version is written into every package manifest before publishing,
# so the tag (not the vendored files) is the source of truth.

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to publish (e.g. 1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version from tag or input
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#sdk-v}"
          fi
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semver version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing SDK version $version"

  rust:
    name: Publish Rust crate
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Set crate version
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" sdks/rust/Cargo.toml
          grep -E "^version" sdks/rust/Cargo.toml

      - name: Package crate
        run: cargo package -p jilebi-sdk --allow-dirty

      - name: Publish to crates.io
        run: cargo publish -p jilebi-sdk --allow-dirty --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

  typescript:
    name: Publish npm package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Set package version
        working-directory: sdks/typescript
        run: npm pkg set version="$VERSION"

      - name: Install dependencies
        working-directory: sdks/typescript
        run: npm install

      - name: Build
        working-directory: sdks/typescript
        run: npm run build

      - name: Publish to npm
        working-directory: sdks/typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  python:
    name: Publish Python package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set package version
        working-directory: sdks/python
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          root = pathlib.Path(".")

          pyproject = root / "pyproject.toml"
          pyproject.write_text(
              re.sub(r'(?m)^version = ".*"', f'version = "{version}"', pyproject.read_text())
          )

          setup_py = root / "setup.py"
          setup_py.write_text(
              re.sub(r'(?m)^VERSION = ".*"', f'VERSION = "{version}"', setup_py.read_text())
          )

          init_py = root / "jilebi_sdk" / "__init__.py"
          init_py.write_text(
              re.sub(r'(?m)^__version__ = ".*"', f'__version__ = "{version}"', init_py.read_text())
          )

          print(f"Set jilebi-sdk to {version}")
          PY

      - name: Build distribution
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
