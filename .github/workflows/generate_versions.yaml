name: Create jilebi version

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  
  generate-version:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - name: Configure git
        run: |
          git config user.email "bot@jilebi.ai"
          git config user.name "Semver bot"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"

      - name: Verify push access to master
        shell: bash
        run: |
          git commit --allow-empty -m "chore: verify master push access"
          trap 'git reset --hard HEAD~1' EXIT

          if ! git push --dry-run origin HEAD:master; then
            echo "::error::The release deploy key cannot update master. Add a write-enabled deploy key to the master ruleset's bypass list (Settings → Rules → master) and store its private key as RELEASE_DEPLOY_KEY."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.platform.target }}
          components: rustfmt, clippy
      
      - name: install cocogitto
        uses: baptiste0928/cargo-install@v2.2.0
        with:
          crate: cocogitto
          version: "6.2.0"
          
      - name: install cargo-edit to perform set-version
        uses: baptiste0928/cargo-install@v2.2.0
        with:
          crate: cargo-edit
          version: "0.13.6"

      - name: Set version
        id: set_version
        run: |
          cog bump --auto --skip-ci-override "[skip ci]"
          
      - name: Get latest tag
        id: git_tag
        shell: bash
        run: |
            version=`git tag -l --sort=-creatordate | head -n 1`
            echo "version=$version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            cargo set-version --workspace $version
            node sdks/scripts/set-version.mjs "$version"
      
      - name: Commit
        run: |
          git add .
          git commit --amend --no-edit
          git tag -f "${{ steps.git_tag.outputs.version }}" HEAD
          git push origin master
          git push origin --tags
  