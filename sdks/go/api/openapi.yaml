openapi: 3.1.0
info:
  description: |-
    Programmatic API for jilebi microVMs, routes, SSH keys, nodes and billing.

    Authenticate with an API key (`X-API-Key` header or `Authorization: Bearer <key>`), or with a browser session cookie. API keys carry scopes — see the `POST /api/v1/api-keys` endpoint for the full list.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: jilebi API
  version: 1.0.0
servers:
- url: https://jilebi.ai
- url: http://localhost:8787
security:
- apiKey: []
- bearerAuth: []
- sessionCookie: []
tags:
- description: The authenticated user and session.
  name: Account
- description: Create and manage microVMs.
  name: MicroVMs
- description: Expose VM ports over public subdomains.
  name: Routes
- description: SSH keys used to log in to microVMs.
  name: SSH keys
- description: API keys and their scopes.
  name: API keys
- description: Host nodes (admin only).
  name: Nodes
- description: Software installable at VM creation (admin only).
  name: Software catalog
- description: "Invoices, payments and admin billing actions."
  name: Billing
paths:
  /api/me:
    get:
      operationId: getApiMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiMeResponse"
          description: The authenticated user and their session.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
      summary: Get the current user and session
      tags:
      - Account
  /api/v1/vmm:
    get:
      description: List every microVM owned by the authenticated user.
      operationId: getApiV1Vmm
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmListResponse"
          description: The user's microVMs.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      security:
      - apiKey: []
      - bearerAuth: []
      - sessionCookie: []
      summary: List microVMs
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}:
    delete:
      operationId: deleteApiV1VmmByMachineName
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Deleted.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Delete a microVM
      tags:
      - MicroVMs
    get:
      operationId: getApiV1VmmByMachineName
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmGetResponse"
          description: The microVM with live hypervisor info.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Get a microVM
      tags:
      - MicroVMs
    post:
      description: Provisions a new microVM on a node with sufficient free capacity.
      operationId: postApiV1VmmByMachineName
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiVmCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmCreateResponse"
          description: Created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid size or over quota
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Overdue unpaid invoice
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Name taken or no node available
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Create a microVM
      tags:
      - MicroVMs
    put:
      operationId: putApiV1VmmByMachineName
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiVmUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Updated.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid size
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Resize a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/start:
    put:
      operationId: putApiV1VmmByMachineNameStart
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: "Started, or already active."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Overdue unpaid invoice
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Start a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/pause:
    put:
      operationId: putApiV1VmmByMachineNamePause
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Paused.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM is not active
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Pause a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/shutdown:
    put:
      operationId: putApiV1VmmByMachineNameShutdown
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Shut down.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM is not active
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Shut down a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/restart:
    put:
      operationId: putApiV1VmmByMachineNameRestart
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
          description: Restarted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM is not active
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Restart a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/snapshot:
    put:
      operationId: putApiV1VmmByMachineNameSnapshot
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiVmSnapshotRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmSnapshotResponse"
          description: Snapshot created.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Snapshot a microVM
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/restore:
    put:
      description: "Restores in place, or creates a new microVM when `new_name` is\
        \ set."
      operationId: putApiV1VmmByMachineNameRestore
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiVmRestoreRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmRestoreResponse"
          description: Restored in place.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmRestoreResponse"
          description: Restored into a new microVM.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid name
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: MicroVM not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Name already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Restore a microVM from a snapshot
      tags:
      - MicroVMs
  /api/v1/vmm/{machine_name}/clone:
    post:
      operationId: postApiV1VmmByMachineNameClone
      parameters:
      - description: Name of the microVM.
        explode: false
        in: path
        name: machine_name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiVmCloneRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiVmCloneResponse"
          description: Clone created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid name or missing SSH key
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Source microVM not found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Name already exists
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Clone a microVM
      tags:
      - MicroVMs
  /api/v1/nodes:
    get:
      operationId: getApiV1Nodes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNodeListResponse"
          description: All nodes.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
      summary: List nodes
      tags:
      - Nodes
    post:
      description: Probes the node's /system endpoint and registers it with its control
        plane.
      operationId: postApiV1Nodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiNodeCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNode"
          description: Registered.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Missing name or url, or probe failed"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node unreachable
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Register a node
      tags:
      - Nodes
  /api/v1/nodes/{name}:
    delete:
      operationId: deleteApiV1NodesByName
      parameters:
      - description: Name of the node.
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNode"
          description: Deleted node.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
      summary: Delete a node
      tags:
      - Nodes
    get:
      operationId: getApiV1NodesByName
      parameters:
      - description: Name of the node.
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNode"
          description: The node.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
      summary: Get a node
      tags:
      - Nodes
    put:
      operationId: putApiV1NodesByName
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiNodeUpdateRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNode"
          description: Updated.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
      summary: Update a node
      tags:
      - Nodes
  /api/v1/nodes/{name}/health:
    post:
      operationId: postApiV1NodesByNameHealth
      parameters:
      - description: Name of the node.
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNodeHealthResponse"
          description: Per-check results.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
      summary: Check node health
      tags:
      - Nodes
  /api/v1/nodes/{name}/refresh:
    post:
      description: Re-probes the node and recomputes available capacity from active
        microVM allocations.
      operationId: postApiV1NodesByNameRefresh
      parameters:
      - description: Name of the node.
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNodeRefreshResponse"
          description: Refreshed node.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node unreachable
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Refresh node resources
      tags:
      - Nodes
  /api/v1/nodes/{name}/reinitialize:
    post:
      description: Pushes the stored host info back to the node's control plane.
      operationId: postApiV1NodesByNameReinitialize
      parameters:
      - description: Name of the node.
        explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiNodeReinitializeResponse"
          description: Reinitialized.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Node not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Reinitialize a node
      tags:
      - Nodes
  /api/v1/software:
    get:
      operationId: getApiV1Software
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSoftwareListResponse"
          description: The software catalog.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: List software
      tags:
      - Software catalog
    post:
      operationId: postApiV1Software
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiSoftwareCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSoftware"
          description: Created.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal server error
      summary: Add software
      tags:
      - Software catalog
  /api/v1/software/{id}:
    delete:
