      tags:
      - Billing
components:
  schemas:
    ApiError:
      example:
        error: error
        code: code
      properties:
        error:
          type: string
        code:
          description: "Machine-readable error code, when available."
          type: string
      required:
      - error
    ApiSuccess:
      example:
        success: true
        message: message
      properties:
        success:
          type: boolean
        message:
          type: string
    ApiVmState:
      description: Lifecycle state persisted on the microVM record.
      enum:
      - active
      - paused
      - offline
      type: string
    ApiVm:
      example:
        id: id
        user_id: user_id
        machine_name: machine_name
        network_name: network_name
        node_name: node_name
        hypervisor_socket: hypervisor_socket
        ip_address: ip_address
        cpu_count: 0
        memory_size: 6
        disk_size_gb: 1
        state: active
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
      properties:
        id:
          type: string
        user_id:
          type: string
        machine_name:
          type: string
        network_name:
          nullable: true
          type: string
        node_name:
          type: string
        hypervisor_socket:
          nullable: true
          type: string
        ip_address:
          description: Private network address (e.g. 192.168.2.2).
          nullable: true
          type: string
        cpu_count:
          description: vCPU count.
          type: integer
        memory_size:
          description: Memory in MiB.
          type: integer
        disk_size_gb:
          description: Disk size in GiB.
          type: integer
        state:
          $ref: "#/components/schemas/ApiVmState"
        created_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - cpu_count
      - created_at
      - disk_size_gb
      - hypervisor_socket
      - id
      - ip_address
      - machine_name
      - memory_size
      - network_name
      - node_name
      - state
      - updated_at
      - user_id
    DeviceNode:
      description: Node in the hypervisor device tree.
      example:
        id: id
        resources:
        - ""
        - ""
        children:
        - children
        - children
        pci_bdf: pci_bdf
      properties:
        id:
          nullable: true
          type: string
        resources:
          items: {}
          nullable: true
          type: array
          default: null
        children:
          items:
            type: string
          nullable: true
          type: array
          default: null
        pci_bdf:
          nullable: true
          type: string
    VmInfo:
      description: Live VM state as reported by the hypervisor.
      example:
        config:
          key: ""
        state: Created
        memory_actual_size: 5
        device_tree:
          key:
            id: id
            resources:
            - ""
            - ""
            children:
            - children
            - children
            pci_bdf: pci_bdf
      properties:
        config:
          additionalProperties: true
          description: Cloud-hypervisor VM config.
          type: object
        state:
          enum:
          - Created
          - Running
          - Shutdown
          - Paused
          type: string
        memory_actual_size:
          description: Memory in bytes.
          nullable: true
          type: integer
        device_tree:
          additionalProperties:
            $ref: "#/components/schemas/DeviceNode"
          nullable: true
          type: object
      required:
      - config
      - state
    ApiVmListResponse:
      items:
        $ref: "#/components/schemas/ApiVm"
      type: array
      default: null
    ApiVmGetResponse:
      allOf:
      - $ref: "#/components/schemas/ApiVm"
      - properties:
          vm_info:
            $ref: "#/components/schemas/VmInfo"
        required:
        - vm_info
      example:
        id: id
        user_id: user_id
        machine_name: machine_name
        network_name: network_name
        node_name: node_name
        hypervisor_socket: hypervisor_socket
        ip_address: ip_address
        cpu_count: 0
        memory_size: 6
        disk_size_gb: 1
        state: active
        created_at: 2000-01-23T04:56:07.000+00:00
        updated_at: 2000-01-23T04:56:07.000+00:00
        vm_info:
          config:
            key: ""
          state: Created
          memory_actual_size: 5
          device_tree:
            key:
              id: id
              resources:
              - ""
              - ""
              children:
              - children
              - children
              pci_bdf: pci_bdf
    ApiVmCreateRequest:
      example:
        cloudinit_user_data:
        - cloudinit_user_data
        - cloudinit_user_data
        software_ids:
        - software_ids
        - software_ids
        public_key: public_key
        cpu_count: 2
        memory_size: 9926
        disk_size_gb: 10
        cloning: cloning
      properties:
        cloudinit_user_data:
          description: "cloud-init `runcmd` entries, de-duplicated with the selected\
            \ software's commands."
          items:
            type: string
          type: array
          default: null
        software_ids:
          description: Software catalog ids to install.
          items:
            type: string
          type: array
          default: null
        public_key:
          description: SSH public key injected into the VM.
          type: string
        cpu_count:
          maximum: 16
          minimum: 1
          type: integer
        memory_size:
          description: Memory in MiB.
          maximum: 16384
          minimum: 128
          type: integer
        disk_size_gb:
          description: Disk size in GiB.
          maximum: 65
          minimum: 1
          type: integer
        cloning:
          description: Existing machine name to clone from.
          type: string
      required:
      - cloudinit_user_data
      - cpu_count
      - disk_size_gb
      - memory_size
      - public_key
    ProvisionedVm:
      description: What provisioning a microVM on a node reports back.
      properties:
        network_name:
          type: string
        hypervisor_socket:
          type: string
      required:
      - hypervisor_socket
      - network_name
    ApiVmCreateResponse:
      allOf:
      - $ref: "#/components/schemas/ProvisionedVm"
      - properties:
          id:
            type: string
          node_name:
            type: string
        required:
        - id
        - node_name
      example:
        network_name: network_name
        hypervisor_socket: hypervisor_socket
        id: id
        node_name: node_name
    ApiVmCloneRequest:
      example:
        new_name: new_name
        public_key: public_key
      properties:
        new_name:
          pattern: "^[a-zA-Z0-9_-]+$"
          type: string
        public_key:
          description: Defaults to the caller's saved SSH key.
          type: string
      required:
      - new_name
    ApiVmCloneResponse:
      allOf:
      - $ref: "#/components/schemas/ApiVmCreateResponse"
      - properties:
          new_name:
            type: string
        required:
        - new_name
      example:
        network_name: network_name
        hypervisor_socket: hypervisor_socket
        id: id
        node_name: node_name
        new_name: new_name
    ApiVmUpdateRequest:
      example:
        cpu_count: 2
        memory_size: 9926
        disk_size_gb: 10
      properties:
        cpu_count:
          maximum: 16
