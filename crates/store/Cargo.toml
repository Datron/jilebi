[package]
name = "jilebi-store"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-web = "0.1.3"
time = { version = "0.3.44", features = ['wasm-bindgen'] }
tracing-subscriber = { workspace = true, features = ["time", "json"] }
worker = { version = "0.7.2", features = ["http", "axum", "d1"] }
axum = { version = "0.8.4", default-features = false, features = ["json"]}
tower-service = "0.3.3"
axum-macros = "0.5.0"
strum_macros = { workspace = true }
reqwest = { workspace = true }
toml = { workspace = true }