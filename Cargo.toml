[workspace]
resolver = "2"
members = ["crates/jilebi", "crates/jilebi_types", "crates/plugin-runtime"]

[workspace.dependencies]
tokio = { version = "1.44.1", features = ["full"] }
strum = "0.27.1"
strum_macros = "0.27.1"
derive_more = { version = "2.0.1", features = ["full"] }
dotenvy = "0.15.7"
serde = "1.0.219"
serde_json = "1.0.140"
toml = "0.8.20"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rmcp = { version = "0.3.0", features = [
	"server",
	"transport-io",
	"transport-sse-server",
	"transport-streamable-http-server",
] }
rustyscript = { version = "0.11.0", default-features = false, features = [
	"fs",
	"web",
] }
deno_core = "0.323.0"

[patch.crates-io]
deno_media_type = { git = 'https://github.com/denoland/deno_media_type', tag = "0.2.6" }
