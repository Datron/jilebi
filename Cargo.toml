[workspace]
resolver = "2"
members = ["crates/jilebi", "crates/jilebi_types", "crates/plugin-runtime"]

[workspace.dependencies]
tokio = { version = "1.44.1", features = ["full"] }
strum = "0.27.1"
strum_macros = "0.27.1"
derive_more = { version = "2.0.1", features = ["full"]}
serde = "1.0.219"
serde_json = "1.0.140"
toml = "0.8.20"
log = "0.4.27"

[patch.crates-io]
deno_media_type = { git = 'https://github.com/denoland/deno_media_type', tag = "0.2.6" }
